<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TürkAI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #090b10;
      color: white;
      font-family: Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 18px;
      border-bottom: 1px solid #20232d;
      background: #0d1017;
      font-size: 22px;
      font-weight: bold;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .message {
      max-width: 850px;
      margin: 12px auto;
      padding: 14px 17px;
      border-radius: 16px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .user {
      background: #171b25;
    }

    .ai {
      background: #10141d;
      border: 1px solid #242936;
    }

    .input-area {
      padding: 15px;
      border-top: 1px solid #20232d;
      background: #0d1017;
      display: flex;
      gap: 10px;
    }

    textarea {
      flex: 1;
      resize: none;
      min-height: 55px;
      max-height: 160px;
      border: 1px solid #292e3b;
      border-radius: 14px;
      background: #141821;
      color: white;
      padding: 15px;
      outline: none;
      font-size: 16px;
    }

    button {
      border: 0;
      border-radius: 14px;
      padding: 0 22px;
      background: #7c5cff;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }
  </style>
</head>

<body>

<header>
  TürkAI
</header>

<div id="chat"></div>

<div class="input-area">
  <textarea
    id="input"
    placeholder="TürkAI'ye bir şey sor..."
  ></textarea>

  <button id="send">
    Gönder
  </button>
</div>

<script>
  const chat = document.getElementById("chat");
  const input = document.getElementById("input");
  const send = document.getElementById("send");

  const history = [];

  function addMessage(text, type) {
    const div = document.createElement("div");

    div.className = `message ${type}`;
    div.textContent = text;

    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  async function sendMessage() {
    const message = input.value.trim();

    if (!message) return;

    input.value = "";
    send.disabled = true;

    addMessage(message, "user");

    try {
      const response = await fetch("/api/chat", {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          message,
          history
        })
      });

      const data = await response.json();

      if (!response.ok || !data.ok) {
        throw new Error(
          data.error || "Bir hata oluştu."
        );
      }

      addMessage(data.answer, "ai");

      history.push({
        role: "user",
        content: message
      });

      history.push({
        role: "assistant",
        content: data.answer
      });

      while (history.length > 20) {
        history.shift();
      }

    } catch (error) {
      addMessage(
        "Hata: " + error.message,
        "ai"
      );
    }

    send.disabled = false;
    input.focus();
  }

  send.addEventListener(
    "click",
    sendMessage
  );

  input.addEventListener(
    "keydown",
    event => {
      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {
        event.preventDefault();
        sendMessage();
      }
    }
  );
</script>

</body>
</html>
